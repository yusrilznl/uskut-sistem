<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop 001 - uskut</title>

  <link rel="stylesheet" href="style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
      feather.replace();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <img src="logo.PNG" alt="uskut Logo">
  </div>

  <!-- MENU -->
  <div class="nav-menu">
    <a href="index.html">Home</a>
    <a href="drop.html">Drop</a>
    <a href="progress.html">Progress</a>
    <a href="about.html">About Us</a>
  </div>

  <div class="navbar-extra">
  <!-- HAMBURGER -->
  <div class="hamburger-menu">
    <a href="#" id="hamburger-menu"><i class="bx bx-menu"></i></a> 
  </div>
  </div>
</nav>


<section class="container-drop" style="padding:60px 0;">
  <h1>DROP 001</h1>
  <p style="color:#666;">Open Pre-Order Collection</p>
</section>

<!-- COUNTDOWN -->
<section class="countdown-section">

  <p class="countdown-label">Pre-Order Close in</p>

  <div class="countdown-container">

    <div class="time-box">
      <h2 id="days">00</h2>
      <span>Days</span>
    </div>

    <div class="time-box">
      <h2 id="hours">00</h2>
      <span>Hours</span>
    </div>

    <div class="time-box">
      <h2 id="minutes">00</h2>
      <span>Minutes</span>
    </div>

    <div class="time-box">
      <h2 id="seconds">00</h2>
      <span>Seconds</span>
    </div>

  </div>

</section>

<!-- PRODUK -->
<section class="products container">

  <div class="section-title">
    <p>OPEN PRE-ORDER</p>
    <h2>Selected Collection</h2>
  </div>

  <div class="product-grid">
    <!-- Products will be loaded dynamically by js/products.js -->
  </div>

  <!-- PRODUCT MODAL -->
  <div class="product-modal" id="productModal">
    <div class="modal-content">
      <!-- CLOSE -->
      <span class="close-modal">&times;</span>

      <!-- LEFT: GALLERY -->
      <div class="modal-gallery">
        <div class="modal-slider">
          <div class="modal-slider-images" id="modalSliderImages">
            <img id="modalImage1" src="" alt="Product Image 1">
            <img id="modalImage2" src="" alt="Product Image 2">
            <img id="modalImage3" src="" alt="Product Image 3">
          </div>
          <button class="modal-slider-btn modal-prev" type="button">
            <i class='bx bx-chevron-left'></i>
          </button>
          <button class="modal-slider-btn modal-next" type="button">
            <i class='bx bx-chevron-right'></i>
          </button>
        </div>
      </div>

      <!-- RIGHT: INFO -->
      <div class="modal-info">
        <p class="badge" id="modalStatus">OPEN PRE-ORDER</p>
        <h2 id="modalTitle"></h2>
        <p class="modal-price" id="modalPrice"></p>
        <p class="modal-desc" id="modalDesc"></p>

        <div class="modal-detail-box">
          <p>📦 Estimasi pengiriman 14–21 hari</p>
          <p>🎯 Produksi terbatas</p>
        </div>
        
        <!-- SIZE -->
        <div class="size-section">
          <h4>Select Size</h4>
          <div class="size-buttons">
            <button class="size-btn" type="button">S</button>
            <button class="size-btn" type="button">M</button>
            <button class="size-btn" type="button">L</button>
            <button class="size-btn" type="button">XL</button>
          </div>
        </div>

        <!-- BUTTON -->
        <button class="preorder-btn" id="preorderBtn" type="button">
          Pre-Order Sekarang
        </button>
      </div>
    </div>
  </div> 
</section>

<footer>
  <p>© 2026 uskut • <a href="/admin/login.html">Admin Panel</a></p>
</footer>

<script src="script.js?v=3"></script>
<script type="module" src="js/products.js?v=2"></script>

</body>
</html>
