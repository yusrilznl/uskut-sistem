    rel="stylesheet"
  >

  <!-- BOXICONS -->
  <link
    href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    rel="stylesheet"
  >

</head>

===================================================== -->

<!-- =====================================================
     PROGRESS
===================================================== -->

<section class="progress-section">


  <!-- HEADER -->

  <div class="progress-header">

    <p>
      ORDER TRACKING
    </p>

    <h1>
      Track Your Order
    </h1>

    <span>
      Masukkan nomor WhatsApp yang digunakan saat
      melakukan pre-order untuk melihat status pesanan.
    </span>

  </div>



  <!-- SEARCH -->

  <div class="progress-search">

    <input
      type="tel"
      id="searchPhone"
      placeholder="Contoh: 08123456789"
    >

    <button
      type="button"
      id="searchOrderBtn"
    >

      <i class="bx bx-search"></i>

      Cari Pesanan

    </button>

  </div>



  <!-- RESULT -->

  <div
    id="orderResult"
    class="order-result"
  >

    <div class="empty-order">

      <i class="bx bx-package"></i>

      <h3>
        Belum ada pesanan
      </h3>

      <p>
        Masukkan nomor WhatsApp untuk melihat
        perkembangan pesanan kamu.
      </p>

    </div>

  </div>


</section>
